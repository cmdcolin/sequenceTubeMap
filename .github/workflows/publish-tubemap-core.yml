name: Publish @gmod/tubemap-core

on:
  push:
    tags:
      - 'tubemap-core-v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - name: Check the tag names this version
        run: |
          version=$(node -p "require('./packages/tubemap-core/package.json').version")
          test "$GITHUB_REF_NAME" = "tubemap-core-v$version"
      - run: pnpm vitest run packages/tubemap-core
      - run: pnpm publish --access public --provenance --no-git-checks
        working-directory: packages/tubemap-core
