name: Test

on:
  push:
    branches:    
      - master
    tags:
      - "*"
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          cache: pnpm
      - name: Install node modules as specified in lockfile
        run: pnpm install --frozen-lockfile
      - name: Install vg v1.74.1
        run: |
          mkdir -p bin
          curl -sSL https://github.com/vgteam/vg/releases/download/v1.74.1/vg >bin/vg
          chmod +x bin/vg
      - name: Run tests
        run: PATH=$PATH:$(pwd)/bin CI=true pnpm test
      - name: Test build
        run: pnpm build

